<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" style="background:#fff; font-family:sans-serif;">
  <rect width="100%" height="100%" fill="#ffffff" />
  
  <!-- North Arrow -->
  <g transform="translate(650, 80)">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#222" stroke-width="2"/>
    <path d="M0 -30 L10 10 L0 5 L-10 10 Z" fill="#222" />
    <text x="0" y="25" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">N</text>
  </g>

  <!-- Context/Street -->
  <path d="M 50 500 C 300 480, 500 520, 750 500" fill="none" stroke="#ddd" stroke-width="30"/>
  <text x="400" y="520" font-size="12" fill="#666" text-anchor="middle" letter-spacing="4">RUA PRINCIPAL</text>
  <line x1="50" y1="485" x2="750" y2="485" stroke="#999" stroke-width="2" stroke-dasharray="10,10"/>
  
  <!-- Lot Boundaries -->
  <polygon points="200,100 600,120 580,450 220,470" fill="none" stroke="#222" stroke-width="3" stroke-dasharray="5,5"/>
  <text x="210" y="250" font-size="10" fill="#666" transform="rotate(-3 210,250)">LOTE VIZINHO 01</text>
  <text x="590" y="250" font-size="10" fill="#666" transform="rotate(-3 590,250)">LOTE VIZINHO 02</text>
  
  <!-- Main Building Roof Plan -->
  <polygon points="280,180 500,190 490,380 270,370" fill="#f0f0f0" stroke="#222" stroke-width="2"/>
  
  <!-- Shadows (Implantação specific) -->
  <polygon points="500,190 530,220 520,410 490,380" fill="#000" opacity="0.1"/>
  <polygon points="490,380 520,410 300,400 270,370" fill="#000" opacity="0.1"/>

  <!-- Pool -->
  <rect x="300" y="130" width="150" height="40" fill="#e6f2ff" stroke="#222" stroke-width="1" transform="rotate(-3 300,130)"/>
  
  <!-- Deck -->
  <rect x="290" y="120" width="170" height="60" fill="none" stroke="#999" stroke-width="1" transform="rotate(-3 300,130)"/>
  
  <!-- Trees (Circles with cross center) -->
  <circle cx="240" cy="150" r="25" fill="#eef7ee" stroke="#666" stroke-width="1"/>
  <path d="M235 150 L245 150 M240 145 L240 155" stroke="#aaa" />
  
  <circle cx="560" cy="170" r="35" fill="#eef7ee" stroke="#666" stroke-width="1"/>
  <path d="M550 170 L570 170 M560 160 L560 180" stroke="#aaa" />
  
  <circle cx="250" cy="420" r="20" fill="#eef7ee" stroke="#666" stroke-width="1"/>
  <path d="M245 420 L255 420 M250 415 L250 425" stroke="#aaa" />
  
  <circle cx="540" cy="430" r="30" fill="#eef7ee" stroke="#666" stroke-width="1"/>
  <path d="M530 430 L550 430 M540 420 L540 440" stroke="#aaa" />

  <!-- Setbacks (Recuos) -->
  <line x1="220" y1="460" x2="270" y2="370" stroke="#999" stroke-width="1"/>
  <text x="235" y="420" font-size="10" fill="#999">5.0m</text>

  <!-- Labels -->
  <text x="390" y="280" font-size="12" fill="#333" letter-spacing="2" text-anchor="middle">COBERTURA PRINCIPAL</text>
  <text x="390" y="300" font-size="10" fill="#666" text-anchor="middle">i = 2%</text>

  <!-- Title / Scale Bar -->
  <text x="150" y="530" font-size="14" fill="#222" letter-spacing="2">PLANTA DE IMPLANTAÇÃO E COBERTURA</text>
  <line x1="150" y1="550" x2="250" y2="550" stroke="#222" stroke-width="2"/>
  <line x1="150" y1="545" x2="150" y2="555" stroke="#222" stroke-width="1"/>
  <line x1="250" y1="545" x2="250" y2="555" stroke="#222" stroke-width="1"/>
  <text x="150" y="570" font-size="10" fill="#222" text-anchor="middle">0</text>
  <text x="250" y="570" font-size="10" fill="#222" text-anchor="middle">5m</text>
</svg>
