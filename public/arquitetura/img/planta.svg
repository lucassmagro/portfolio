<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" style="background:#fff; font-family:sans-serif;">
  <rect width="100%" height="100%" fill="#ffffff" />
  <!-- Grid lines -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f0f0f0" stroke-width="1"/>
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid)" />
  
  <!-- Outer Walls -->
  <path d="M150 100 L650 100 L650 500 L150 500 Z" fill="none" stroke="#222" stroke-width="4"/>
  <path d="M160 110 L640 110 L640 490 L160 490 Z" fill="none" stroke="#222" stroke-width="2"/>
  
  <!-- Inner Walls -->
  <path d="M350 110 L350 300 L640 300" fill="none" stroke="#222" stroke-width="3"/>
  <path d="M160 350 L450 350 L450 490" fill="none" stroke="#222" stroke-width="3"/>
  <path d="M350 200 L450 200 L450 110" fill="none" stroke="#222" stroke-width="3"/>
  
  <!-- Doors (gaps + arcs) -->
  <rect x="345" y="220" width="10" height="40" fill="#fff" />
  <path d="M350 260 Q 390 260 390 220" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="350" y1="260" x2="390" y2="260" stroke="#222" stroke-width="2"/>
  
  <rect x="400" y="295" width="40" height="10" fill="#fff" />
  <path d="M400 300 Q 400 340 440 340" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="400" y1="300" x2="400" y2="340" stroke="#222" stroke-width="2"/>
  
  <rect x="250" y="345" width="40" height="10" fill="#fff" />
  <path d="M290 350 Q 290 310 250 310" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="290" y1="350" x2="290" y2="310" stroke="#222" stroke-width="2"/>
  
  <!-- Windows -->
  <rect x="200" y="96" width="100" height="8" fill="#fff" stroke="#222" stroke-width="1"/>
  <line x1="200" y1="100" x2="300" y2="100" stroke="#222" stroke-width="1"/>
  <rect x="500" y="496" width="100" height="8" fill="#fff" stroke="#222" stroke-width="1"/>
  <line x1="500" y1="500" x2="600" y2="500" stroke="#222" stroke-width="1"/>
  <rect x="146" y="200" width="8" height="80" fill="#fff" stroke="#222" stroke-width="1"/>
  <line x1="150" y1="200" x2="150" y2="280" stroke="#222" stroke-width="1"/>
  
  <!-- Room Labels -->
  <text x="250" y="230" font-size="14" fill="#666" text-anchor="middle" letter-spacing="2">LIVING</text>
  <text x="250" y="250" font-size="10" fill="#999" text-anchor="middle">54.2 m²</text>
  
  <text x="500" y="200" font-size="14" fill="#666" text-anchor="middle" letter-spacing="2">SUÍTE PRINCIPAL</text>
  <text x="500" y="220" font-size="10" fill="#999" text-anchor="middle">32.0 m²</text>
  
  <text x="400" y="150" font-size="14" fill="#666" text-anchor="middle" letter-spacing="2">BANHO</text>
  
  <text x="550" y="400" font-size="14" fill="#666" text-anchor="middle" letter-spacing="2">JANTAR / COZINHA</text>
  <text x="550" y="420" font-size="10" fill="#999" text-anchor="middle">48.5 m²</text>
  
  <text x="300" y="430" font-size="14" fill="#666" text-anchor="middle" letter-spacing="2">ESCRITÓRIO</text>
  <text x="300" y="450" font-size="10" fill="#999" text-anchor="middle">18.4 m²</text>
  
  <!-- Scale Bar -->
  <line x1="150" y1="540" x2="250" y2="540" stroke="#222" stroke-width="2"/>
  <line x1="150" y1="535" x2="150" y2="545" stroke="#222" stroke-width="1"/>
  <line x1="200" y1="535" x2="200" y2="545" stroke="#222" stroke-width="1"/>
  <line x1="250" y1="535" x2="250" y2="545" stroke="#222" stroke-width="1"/>
  <text x="150" y="560" font-size="10" fill="#222" text-anchor="middle">0</text>
  <text x="200" y="560" font-size="10" fill="#222" text-anchor="middle">1</text>
  <text x="250" y="560" font-size="10" fill="#222" text-anchor="middle">2m</text>
</svg>
