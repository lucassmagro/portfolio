<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Mesma forma do .brand__mark do site: topo semicircular e base levemente
       arredondada, no gradiente das variaveis green e dark. A placa no tom de
       fundo do site mantem a marca visivel tambem em aba escura.
       (Sem hifen duplo aqui dentro: XML proibe em comentario.) -->
  <defs>
    <linearGradient id="aurema" x1="0.33" y1="0" x2="0.67" y2="1">
      <stop offset="0" stop-color="#2E7D6B"/>
      <stop offset="1" stop-color="#143A33"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#FCFBF8"/>
  <path d="M80 368 L80 256 A176 176 0 0 1 432 256 L432 368 A64 64 0 0 1 368 432 L144 432 A64 64 0 0 1 80 368 Z" fill="url(#aurema)"/>
</svg>
